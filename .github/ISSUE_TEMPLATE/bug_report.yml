name: Bug report
description: A tool returned an error or a wrong result
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: For example search_nih_awards
    validations:
      required: true
  - type: textarea
    id: arguments
    attributes:
      label: Arguments
      description: The arguments sent to the tool. Remove anything private.
      render: json
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: For example Cursor, Grok or the MCP Inspector
